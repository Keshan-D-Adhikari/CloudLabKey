<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canteen Bill Splitter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4facfe;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #00c6ff;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #222;
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍽️ Bill Splitter</h1>
    <p>University Canteen Utility</p>

    <input type="number" id="totalAmount" placeholder="Total Amount (Rs)" />
    <input type="number" id="people" placeholder="Number of People" />
    <input type="number" id="tip" placeholder="Tip Percentage (Optional)" />

    <button onclick="calculateBill()">Split Bill</button>

    <div class="result" id="result"></div>

    <div class="footer">
      Created by Keshan | Group 4 Assignment
    </div>
  </div>

  <script>
    function calculateBill() {
      const total = parseFloat(document.getElementById("totalAmount").value);
      const people = parseInt(document.getElementById("people").value);
      const tip = parseFloat(document.getElementById("tip").value) || 0;

      if (isNaN(total) || isNaN(people) || people <= 0) {
        document.getElementById("result").innerText = "Please enter valid values.";
        return;
      }

      const tipAmount = (total * tip) / 100;
      const finalTotal = total + tipAmount;
      const perPerson = finalTotal / people;

      document.getElementById("result").innerText =
        `Each person pays: Rs. ${perPerson.toFixed(2)}`;
    }
  </script>

</body>
</html>
